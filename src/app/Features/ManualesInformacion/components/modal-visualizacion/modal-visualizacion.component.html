<!-- Modal -->
<div class="modal fade" id="modalVisualizacion" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="modalVisualizacionLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalVisualizacionLabel">Vsualizacion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" ></button>
      </div>
      <div class="modal-body" *ngIf="tipoContenido == 'pdf'" style="height: 80vh;">
          <iframe [src]="urlDocumentoModal" width="100%" height="100%" frameborder="0"></iframe>
      </div>
      <div class="modal-body" *ngIf="tipoContenido == 'video'">
          <video width="100%" height="100%" controls [src]="urlDocumentoModal">
          </video>
      </div>

      <div class="modal-body" *ngIf="tipoContenido == 'presentacion'">
          <h1>presentacion</h1>
          <!-- <iframe [src]="urlDocumentoModal | urlDocumentos" width="100%" height="100%" frameborder="0"></iframe> -->
      </div>
      <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" >Cerrar</button>
      </div>
    </div>
  </div>
</div>
