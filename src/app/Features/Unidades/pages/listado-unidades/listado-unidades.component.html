
<div class="card cardContenido" >
  <div class="card-header card-header-paddin d-flex justify-content-between align-items-center">
      <h3>Listado de unidades</h3>
  </div>
  <div class="card-body card-body-page">
      <div class="table-usuarios">
          <table class="table table-hover table-usuarios__tabla table-responsive table-bordered" >
              <thead class="text-center table-dark">
                  <tr>
                      <th>ID</th>
                      <th>Nombre</th>
                      <th>Sigla</th>
                      <th>Unidad Padre</th>
                      <th>Departamento</th>
                      <th>Municipio</th>
                      <th>Estado</th>
                      <th>OP</th>
                  </tr>
              </thead>
              <tbody class="text-center">
                  <tr *ngFor="let unidad of listaUnidades.data">
                      <td>{{ unidad.id_unidad }}</td>
                      <td>{{ unidad.nombre }}</td>
                      <td>{{ unidad.sigla }}</td>
                      <td>{{ unidad.padre }}</td>
                      <td>{{ unidad.departamento }}</td>
                      <td>{{ unidad.municipio }}</td>
                      <td>{{ unidad.estado }}</td><td>
                          <button type="button" class="btn btn-primary" style="margin-right: 1rem;" > <i class="fas fa-pen fa-lg fa-fw"></i> </button>
                          <button type="button" class="btn btn-secondary"> <i class="fas fa-minus-circle fa-lg fa-fw"></i> </button>
                      </td>
                  </tr>
              </tbody>
          </table>
      </div>
      <nav aria-label="..." *ngIf="pagina > 0">
          <ul class="pagination">
              <li class="page-item">
                  <a class="page-link" [class.disabled]="listaUnidades.infoPagination.pagina === 1" (click)="cambiarPagina(listaUnidades.infoPagination.pagina - 1)">Anterior</a>
              </li>

              <li *ngFor="let pagina of [].constructor(listaUnidades.infoPagination.totalPaginas); let i = index;" class="page-item" [class.active]="listaUnidades.infoPagination.pagina == i+1"><a class="page-link"(click)="cambiarPagina(i+1)">{{ i + 1 }}</a></li>

              <li class="page-item">
                  <a class="page-link" [class.disabled]="listaUnidades.infoPagination.pagina === listaUnidades.infoPagination.totalPaginas" (click)="cambiarPagina(listaUnidades.infoPagination.pagina + 1)">Siguiente</a>
              </li>
          </ul>
      </nav>
  </div>
</div>
