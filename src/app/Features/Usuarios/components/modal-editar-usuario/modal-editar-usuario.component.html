<!-- Button trigger modal -->


<!-- Modal -->
    <div class="modal fade" id="modalUsuario" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title" id="staticBackdropLabel">Actualizar Usuario</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form class="formulario-editar-usuario" [formGroup]="formularioEdit">
                        <!-- formulario-editar__texto -->
                         <div class="formulario-editar__campos" >
                            <div class="form-group">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" formControlName="nombre">
                            </div>

                            <div class="form-group">
                                <label for="identificacion" class="form-label">Identificacion</label>
                                <input type="text" class="form-control" formControlName="identificacion" >
                            </div>

                            <div class="form-group">
                                <label for="" class="form-label">Usuario</label>
                                <input type="text" class="form-control" formControlName="user">
                            </div>

                            <div class="form-group">
                                <label for="" class="form-label">Email</label>
                                <input type="email" class="form-control" formControlName="emailUsuario">
                            </div>

                            <div class="form-group">
                              <label for="cargo" class="form-label">Cargo</label>
                              <select class="form-select" formControlName="cargo">
                                  <option value="">Seleccione</option>
                                  <option *ngFor="let cargo of cargos.data" [value]="cargo.id">
                                      {{ cargo.nombre }}
                                  </option>
                              </select>
                          </div>

                            <div class="form-group">
                                <label for="" class="form-label">Cargo</label>
                                <select class="form-select">
                                    <option *ngFor="let tipo of tipoUsuarios.data" value="{{ tipo.id }}">{{ tipo.nombre }}</option>
                                </select>
                            </div>
                         </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary">Actualizar</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
